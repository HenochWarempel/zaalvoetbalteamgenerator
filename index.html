<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zaalvoetbal-teamgenerator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');

    * { font-family: 'Inter', sans-serif; }

    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 50%, #0f172a 100%);
      min-height: 100vh;
    }

    .player-card {
      position: relative;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .player-card:active { transform: scale(0.94); }
    .player-card.selected .avatar {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      box-shadow: 0 0 0 3px #22c55e55;
    }
    .player-card.selected .card-bg {
      background: #052e16;
      border-color: #22c55e;
    }
    .player-card .card-bg {
      background: #1e293b;
      border: 2px solid #334155;
      border-radius: 14px;
      padding: 14px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      transition: background 0.2s, border-color 0.2s;
    }
    .avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: linear-gradient(135deg, #334155, #475569);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 16px;
      color: white;
      transition: background 0.2s, box-shadow 0.2s;
    }
    .player-name {
      font-size: 13px;
      font-weight: 600;
      color: #e2e8f0;
      text-align: center;
    }
    .player-card.selected .player-name { color: #86efac; }

    .checkmark {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 18px;
      height: 18px;
      background: #22c55e;
      border-radius: 50%;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .player-card.selected .checkmark { display: flex; }

    .btn-primary {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
      font-weight: 700;
      padding: 14px 28px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      font-size: 15px;
      box-shadow: 0 4px 15px #2563eb55;
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .btn-primary:active { transform: scale(0.97); box-shadow: 0 2px 8px #2563eb44; }

    .btn-secondary {
      background: #1e293b;
      color: #94a3b8;
      font-weight: 600;
      padding: 14px 28px;
      border-radius: 12px;
      border: 2px solid #334155;
      cursor: pointer;
      font-size: 15px;
      transition: background 0.15s, color 0.15s;
    }
    .btn-secondary:active { background: #0f172a; }

    .team-card {
      border-radius: 16px;
      padding: 20px;
      flex: 1;
    }
    .team-a { background: linear-gradient(160deg, #1e3a8a22, #1e40af33); border: 2px solid #3b82f6; }
    .team-b { background: linear-gradient(160deg, #7c2d1222, #c2410c33); border: 2px solid #f97316; }

    .team-label-a {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      display: inline-block;
      margin-bottom: 12px;
    }
    .team-label-b {
      background: linear-gradient(135deg, #f97316, #ea580c);
      color: white;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      display: inline-block;
      margin-bottom: 12px;
    }

    .player-pill {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-radius: 10px;
      background: #ffffff0d;
      margin-bottom: 6px;
    }
    .player-pill-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 12px;
      color: white;
      flex-shrink: 0;
    }
    .pill-a .player-pill-avatar { background: linear-gradient(135deg, #2563eb, #1d4ed8); }
    .pill-b .player-pill-avatar { background: linear-gradient(135deg, #f97316, #ea580c); }
    .player-pill span { color: #e2e8f0; font-weight: 600; font-size: 14px; }

    .strength-bar-container {
      background: #0f172a;
      border-radius: 8px;
      height: 10px;
      overflow: hidden;
      position: relative;
    }
    .strength-bar-a {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      background: linear-gradient(90deg, #2563eb, #60a5fa);
      border-radius: 8px;
      transition: width 0.6s ease;
    }
    .strength-bar-b {
      position: absolute;
      right: 0;
      top: 0;
      height: 100%;
      background: linear-gradient(270deg, #f97316, #fb923c);
      border-radius: 8px;
      transition: width 0.6s ease;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
    }
    .badge-blue { background: #1e3a8a; color: #93c5fd; border: 1px solid #3b82f6; }
    .badge-orange { background: #431407; color: #fdba74; border: 1px solid #f97316; }

    .tikkie-card {
      background: linear-gradient(135deg, #713f12, #92400e);
      border: 2px solid #d97706;
      border-radius: 16px;
      padding: 20px;
      text-align: center;
    }

    .result-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 20px;
      padding: 28px;
      animation: slideUp 0.3s ease;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .section-header {
      color: #64748b;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }

    .counter-chip {
      background: #334155;
      color: #94a3b8;
      font-size: 12px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 20px;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center p-6">

  <!-- Header -->
  <div class="w-full max-w-lg mb-8 text-center">
    <div class="text-4xl mb-2">⚽</div>
    <h1 class="text-3xl font-extrabold text-white tracking-tight">Zaalvoetbal</h1>
    <p class="text-slate-400 text-sm mt-1">Teamgenerator</p>
  </div>

  <!-- Spelerselectie -->
  <div class="w-full max-w-lg mb-3 flex items-center justify-between">
    <p class="section-header" style="margin-bottom:0">Selecteer spelers</p>
    <span id="counter" class="counter-chip">0 geselecteerd</span>
  </div>
  <div id="players" class="grid grid-cols-3 gap-3 w-full max-w-lg mb-6"></div>

  <!-- Knoppen -->
  <div class="flex gap-3">
    <button id="back" class="btn-secondary hidden">← Vorige</button>
    <button id="generate" class="btn-primary">Genereer teams →</button>
  </div>

  <!-- Resultaat -->
  <div id="result" class="mt-8 w-full max-w-2xl"></div>

  <script>
    const encodedPlayers = [
      { name: "Arhan",   rank: "Ni4yNQ==" },
      { name: "David",   rank: "Ny42" },
      { name: "Henoch",  rank: "Ny44" },
      { name: "Jan",     rank: "OC40" },
      { name: "John",    rank: "Ni44" },
      { name: "Just",    rank: "Ny40" },
      { name: "Mathew",  rank: "Ni4x" },
      { name: "Mesach",  rank: "Ni42" },
      { name: "Stephan", rank: "OC45" },
      { name: "Tom B",   rank: "Ny45" },
      { name: "Tom P",   rank: "Ni44" }
    ];

    function decodeRank(encoded) { return parseFloat(atob(encoded)); }

    const players = encodedPlayers.map(p => ({ name: p.name, rank: decodeRank(p.rank) }));

    const container  = document.getElementById("players");
    const generateBtn = document.getElementById("generate");
    const backBtn    = document.getElementById("back");
    const resultDiv  = document.getElementById("result");
    const counterEl  = document.getElementById("counter");

    function initials(name) {
      return name.split(" ").map(w => w[0]).join("").toUpperCase().slice(0, 2);
    }

    function updateCounter() {
      const n = players.filter(p => p.selected).length;
      counterEl.textContent = `${n} geselecteerd`;
      counterEl.style.background = n >= 6 ? "#052e16" : "#334155";
      counterEl.style.color = n >= 6 ? "#86efac" : "#94a3b8";
      counterEl.style.border = n >= 6 ? "1px solid #22c55e" : "none";
    }

    players.forEach((p) => {
      const card = document.createElement("div");
      card.className = "player-card";
      card.innerHTML = `
        <div class="card-bg">
          <div class="avatar">${initials(p.name)}</div>
          <span class="player-name">${p.name}</span>
        </div>
        <div class="checkmark">
          <svg width="10" height="10" viewBox="0 0 10 10" fill="none">
            <path d="M1.5 5L4 7.5L8.5 2.5" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      `;
      p.selected = false;

      card.addEventListener("pointerdown", () => {
        p.selected = !p.selected;
        card.classList.toggle("selected", p.selected);
        updateCounter();
        void card.offsetWidth;
      });

      container.appendChild(card);
    });

    let allSplits = [];
    let currentIndex = -1;
    let baselineDiff = null;

    generateBtn.onclick = () => {
      const selected = players.filter(p => p.selected);
      if (selected.length < 6) { alert("Minimaal 6 spelers selecteren!"); return; }
      if (selected.length > 11) { alert("Maximaal 11 spelers!"); return; }

      if (allSplits.length === 0) {
        allSplits = generateAllSplits(selected);
        currentIndex = 0;
        baselineDiff = allSplits[0].diff;
      } else {
        currentIndex++;
        if (currentIndex >= allSplits.length) {
          alert("Geen nieuwe combinaties meer.");
          currentIndex = allSplits.length - 1;
          return;
        }
      }

      showResult(allSplits, currentIndex, selected.length);
      backBtn.classList.toggle("hidden", currentIndex === 0);
    };

    backBtn.onclick = () => {
      if (currentIndex > 0) {
        currentIndex--;
        const selected = players.filter(p => p.selected);
        showResult(allSplits, currentIndex, selected.length);
        backBtn.classList.toggle("hidden", currentIndex === 0);
      }
    };

    function generateAllSplits(selected) {
      const n = selected.length;
      const splits = [];
      const seen = new Set();
      const total = 1 << n;

      for (let mask = 1; mask < total - 1; mask++) {
        const teamA = [], teamB = [];
        for (let i = 0; i < n; i++) {
          if (mask & (1 << i)) teamA.push(selected[i]);
          else teamB.push(selected[i]);
        }
        if (!isValidTeamSplit(teamA.length, teamB.length, n)) continue;

        const namesA = teamA.map(p => p.name).sort().join(",");
        const namesB = teamB.map(p => p.name).sort().join(",");
        const key1 = namesA + "|" + namesB;
        const key2 = namesB + "|" + namesA;
        if (seen.has(key1) || seen.has(key2)) continue;
        seen.add(key1);

        const avgA = calcWeightedAvg(teamA);
        const avgB = calcWeightedAvg(teamB);
        const diff = Math.abs(avgA - avgB);
        splits.push({ teamA, teamB, avgA, avgB, diff });
      }

      splits.sort((a, b) => a.diff - b.diff);
      return splits;
    }

    function showResult(splits, idx, deelnemers) {
      const s = splits[idx];
      const bedrag = Math.ceil((40 / deelnemers) * 100) / 100;
      const hesjesTeam = Math.random() < 0.5 ? "A" : "B";
      const balTeam    = Math.random() < 0.5 ? "A" : "B";

      let fairnessLabel = "";
      if (idx === 0) {
        fairnessLabel = `<span style="background:#052e16;color:#86efac;border:1px solid #22c55e;" class="text-xs font-bold px-3 py-1 rounded-full">Meest eerlijk</span>`;
      } else {
        const perc = ((s.diff - baselineDiff) / baselineDiff) * 100;
        fairnessLabel = `<span style="background:#1e293b;color:#94a3b8;border:1px solid #475569;" class="text-xs font-bold px-3 py-1 rounded-full">±${perc.toFixed(1)}% minder eerlijk</span>`;
      }

      // Sterktebalk: verhouding op basis van gemiddelden
      const totalAvg = s.avgA + s.avgB;
      const widthA = ((s.avgA / totalAvg) * 100).toFixed(1);
      const widthB = ((s.avgB / totalAvg) * 100).toFixed(1);

      const hesjesBadge = hesjesTeam === "A"
        ? `<span class="badge badge-blue">👕 Team A draagt hesjes</span>`
        : `<span class="badge badge-orange">👕 Team B draagt hesjes</span>`;

      const balBadge = balTeam === "A"
        ? `<span class="badge badge-blue">⚽ Team A bal uit</span>`
        : `<span class="badge badge-orange">⚽ Team B bal uit</span>`;

      resultDiv.innerHTML = `
        <div class="result-card">

          <!-- Header -->
          <div class="flex items-center justify-between mb-6">
            <h2 class="text-white text-xl font-extrabold">Teams</h2>
            ${fairnessLabel}
          </div>

          <!-- Teams -->
          <div class="flex gap-4 mb-6">
            <div class="team-card team-a">
              <div class="team-label-a">Team A</div>
              <div class="text-slate-400 text-xs mb-3 font-semibold">gem. ${s.avgA.toFixed(2)}</div>
              ${s.teamA.map(p => `
                <div class="player-pill pill-a">
                  <div class="player-pill-avatar">${initials(p.name)}</div>
                  <span>${p.name}</span>
                </div>
              `).join("")}
            </div>
            <div class="team-card team-b">
              <div class="team-label-b">Team B</div>
              <div class="text-slate-400 text-xs mb-3 font-semibold">gem. ${s.avgB.toFixed(2)}</div>
              ${s.teamB.map(p => `
                <div class="player-pill pill-b">
                  <div class="player-pill-avatar">${initials(p.name)}</div>
                  <span>${p.name}</span>
                </div>
              `).join("")}
            </div>
          </div>

          <!-- Sterktebalk -->
          <div class="mb-6">
            <div class="section-header">Sterktebalans</div>
            <div class="flex justify-between text-xs font-bold mb-2">
              <span style="color:#60a5fa">A: ${s.avgA.toFixed(2)}</span>
              <span style="color:#fb923c">B: ${s.avgB.toFixed(2)}</span>
            </div>
            <div class="strength-bar-container">
              <div class="strength-bar-a" style="width:${widthA}%"></div>
              <div class="strength-bar-b" style="width:${widthB}%"></div>
            </div>
            <p class="text-slate-500 text-xs text-center mt-2">
              Verschil: ${Math.abs(s.avgA - s.avgB).toFixed(2)} punten
            </p>
          </div>

          <!-- Badges -->
          <div class="mb-6">
            <div class="section-header">Loting</div>
            <div class="flex flex-wrap gap-2">
              ${hesjesBadge}
              ${balBadge}
            </div>
          </div>

          <!-- Tikkie -->
          <div class="tikkie-card">
            <div class="text-2xl mb-1">🤑</div>
            <div class="text-amber-200 text-sm font-semibold mb-1">Tikkie van vanavond</div>
            <div class="text-white text-3xl font-extrabold">€${bedrag.toFixed(2)}</div>
            <a href="https://tikkie.me" target="_blank"
               class="inline-block mt-3 bg-amber-500 hover:bg-amber-400 text-white text-sm font-bold px-5 py-2 rounded-full transition">
              Stuur Tikkie →
            </a>
          </div>

        </div>
      `;
    }

    function isValidTeamSplit(sizeA, sizeB, n) {
      if (n === 6)  return sizeA === 3 && sizeB === 3;
      if (n === 7)  return (sizeA === 4 && sizeB === 3) || (sizeA === 3 && sizeB === 4);
      if (n === 8)  return sizeA === 4 && sizeB === 4;
      if (n === 9)  return (sizeA === 5 && sizeB === 4) || (sizeA === 4 && sizeB === 5);
      if (n === 10) return sizeA === 5 && sizeB === 5;
      if (n === 11) return (sizeA === 5 && sizeB === 6) || (sizeA === 6 && sizeB === 5);
      return false;
    }

    function calcWeightedAvg(team) {
      const n = team.length;
      if (n === 3 || n === 4) return team.reduce((s, p) => s + p.rank, 0) / n;
      if (n === 5) {
        let total = 0;
        for (let i = 0; i < n; i++) {
          const subset = team.filter((_, j) => j !== i);
          total += subset.reduce((s, p) => s + p.rank, 0) / 4;
        }
        return total / 5;
      }
      if (n === 6) {
        let total = 0, count = 0;
        const comb = (arr, k, start = 0, prev = []) => {
          if (prev.length === k) { total += prev.reduce((s, p) => s + p.rank, 0) / 4; count++; return; }
          for (let i = start; i < arr.length; i++) comb(arr, k, i + 1, prev.concat(arr[i]));
        };
        comb(team, 4);
        return total / count;
      }
      return 0;
    }
  </script>

  <footer class="mt-12 text-center text-sm text-slate-500">
    © All rights reserved but not allemaal.
    <a href="https://wa.me/31636068477?text=Hoi,%20geniale%20zaalvoetbalteamgenerator-bedenker."
       target="_blank" class="text-green-500 hover:underline">App Henoch</a>
  </footer>
</body>
</html>
