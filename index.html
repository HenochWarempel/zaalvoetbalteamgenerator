<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zaalvoetbal — Teamgenerator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f6f4;
    --surface: #ffffff;
    --surface-2: #f0f1ee;
    --border: #e3e5e1;
    --text: #16181c;
    --text-dim: #6b7078;
    --text-faint: #9ba0a8;
    --accent: #16a34a;
    --accent-ink: #ffffff;
    --accent-soft: #e8f6ee;
    --teamA: #2563eb;
    --teamA-soft: #eaf1ff;
    --teamB: #ea580c;
    --teamB-soft: #fff1e6;
    --gold: #eab308;
    --danger: #dc2626;
    --shadow: 0 1px 2px rgba(20,20,20,.04), 0 4px 16px rgba(20,20,20,.06);
    --radius: 16px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115;
      --surface: #181b20;
      --surface-2: #1f232a;
      --border: #2a2f37;
      --text: #f2f3f5;
      --text-dim: #9aa1ac;
      --text-faint: #6b7280;
      --accent: #22c55e;
      --accent-ink: #08130c;
      --accent-soft: #143323;
      --teamA: #60a5fa;
      --teamA-soft: #16233d;
      --teamB: #fb923c;
      --teamB-soft: #3a2414;
      --gold: #facc15;
      --danger: #f87171;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 20px 16px 60px; }

  /* ---------- header ---------- */
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; }
  header h1 { font-size: 21px; font-weight: 800; margin: 0; letter-spacing: -0.02em; }
  header p { margin: 2px 0 0; font-size: 13px; color: var(--text-dim); }
  .icon-btn {
    width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--border);
    background: var(--surface); display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: var(--text-dim); flex: none; transition: background .15s, color .15s, border-color .15s;
  }
  .icon-btn svg { width: 19px; height: 19px; }
  .icon-btn.active { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
  .icon-btn:active { transform: scale(.94); }

  /* ---------- cards / sections ---------- */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
  .section-title { display: flex; align-items: center; justify-content: space-between; margin: 26px 0 10px; }
  .section-title h2 { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--text-dim); margin: 0; }
  .section-title:first-child { margin-top: 0; }
  .pill {
    font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 100px;
    background: var(--surface-2); color: var(--text-dim);
  }
  .pill.ready { background: var(--accent-soft); color: var(--accent); }

  /* ---------- roster ---------- */
  #roster { display: flex; flex-direction: column; gap: 8px; }
  .prow {
    display: flex; align-items: center; gap: 12px; padding: 11px 14px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    cursor: pointer; user-select: none; transition: border-color .15s, background .15s;
  }
  .prow.sel { border-color: var(--accent); background: var(--accent-soft); }
  .avatar {
    width: 38px; height: 38px; border-radius: 50%; flex: none;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 14px; color: #fff;
  }
  .pbody { flex: 1; min-width: 0; }
  .pname { font-size: 15px; font-weight: 600; line-height: 1.25; }
  .check {
    width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--border);
    flex: none; display: flex; align-items: center; justify-content: center; color: #fff;
    transition: background .15s, border-color .15s;
  }
  .prow.sel .check { background: var(--accent); border-color: var(--accent); }
  .check svg { width: 13px; height: 13px; opacity: 0; transition: opacity .1s; }
  .prow.sel .check svg { opacity: 1; }

  /* ---------- buttons ---------- */
  .btnrow { display: flex; gap: 10px; margin-top: 16px; }
  .btn {
    flex: 1; border: none; border-radius: 14px; padding: 14px; font-size: 15px; font-weight: 700;
    font-family: inherit; cursor: pointer; transition: filter .15s, transform .05s;
  }
  .btn:active { transform: scale(.98); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); }
  .btn.primary:disabled { opacity: .4; cursor: not-allowed; }
  .btn.ghost { background: var(--surface-2); color: var(--text); flex: .5; }
  .btn.text { background: none; color: var(--accent); padding: 10px; }
  .hint { text-align: center; font-size: 12.5px; color: var(--text-faint); margin-top: 10px; }
  .status-msg {
    text-align: center; font-size: 13px; font-weight: 600; color: var(--danger);
    margin-top: 10px; opacity: 0; transition: opacity .2s; height: 0; overflow: hidden;
  }
  .status-msg.show { opacity: 1; height: auto; padding: 2px 0; }

  /* ---------- results: logistics banner ---------- */
  .logistics { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
  .logistics-row { display: flex; gap: 10px; }
  .badge-card {
    flex: 1; padding: 12px 14px; border-radius: 14px; display: flex; align-items: center; gap: 10px;
  }
  .badge-card .ico { font-size: 20px; flex: none; }
  .badge-card .lbl { font-size: 11px; color: var(--text-dim); font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
  .badge-card .val { font-size: 14px; font-weight: 700; margin-top: 1px; }
  .badge-card.A { background: var(--teamA-soft); }
  .badge-card.B { background: var(--teamB-soft); }
  .badge-card.A .val { color: var(--teamA); }
  .badge-card.B .val { color: var(--teamB); }

  .tikkie-card { padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .tikkie-info .lbl { font-size: 11px; color: var(--text-dim); font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
  .tikkie-info .amt { font-size: 22px; font-weight: 800; margin-top: 1px; }
  .tikkie-edit { display: flex; align-items: center; gap: 4px; background: var(--surface-2); border-radius: 10px; padding: 6px 10px; }
  .tikkie-edit span { font-size: 13px; color: var(--text-dim); }
  .tikkie-edit input {
    width: 52px; border: none; background: none; font-family: inherit; font-size: 14px;
    font-weight: 700; color: var(--text); text-align: right;
  }
  .tikkie-edit input:focus { outline: none; }

  /* ---------- combo list ---------- */
  #comboList { display: flex; flex-direction: column; gap: 8px; }
  details.combo { border: 1px solid var(--border); border-radius: 14px; background: var(--surface); overflow: hidden; }
  details.combo[open] { border-color: var(--accent); }
  details.combo summary {
    list-style: none; cursor: pointer; padding: 12px 14px; display: flex; align-items: center; gap: 10px;
  }
  details.combo summary::-webkit-details-marker { display: none; }
  .combo-rank {
    width: 26px; height: 26px; border-radius: 50%; background: var(--surface-2); color: var(--text-dim);
    font-size: 12px; font-weight: 700; flex: none; display: flex; align-items: center; justify-content: center;
  }
  details.combo:first-of-type .combo-rank { background: var(--accent); color: var(--accent-ink); }
  .combo-mid { flex: 1; min-width: 0; }
  .combo-fair { font-size: 13px; font-weight: 700; }
  .combo-sub { font-size: 12px; color: var(--text-faint); margin-top: 1px; }
  .combo-chevron { flex: none; color: var(--text-faint); transition: transform .15s; }
  .combo-chevron svg { width: 16px; height: 16px; }
  details.combo[open] .combo-chevron { transform: rotate(180deg); }

  .mini-bar { height: 6px; border-radius: 4px; overflow: hidden; display: flex; background: var(--surface-2); margin-top: 6px; }
  .mini-bar .a { background: var(--teamA); }
  .mini-bar .b { background: var(--teamB); }

  .combo-body { padding: 4px 14px 16px; border-top: 1px solid var(--border); }
  .teamgrid { display: flex; gap: 10px; margin-top: 12px; }
  .teamcol { flex: 1; min-width: 0; }
  .teamcol-hd { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .teamcol-hd .name { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; }
  .teamcol-hd.A .name { color: var(--teamA); }
  .teamcol-hd.B .name { color: var(--teamB); }
  .tplayer { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 9px; background: var(--surface-2); margin-bottom: 5px; }
  .tplayer .avatar { width: 26px; height: 26px; font-size: 11px; }
  .tplayer .pname { font-size: 13px; font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .balance-full { margin-top: 12px; }
  .balance-full .row { display: flex; justify-content: space-between; font-size: 11px; font-weight: 700; margin-bottom: 4px; }
  .balance-full .row .a { color: var(--teamA); } .balance-full .row .b { color: var(--teamB); }
  .balance-full .bar { height: 10px; border-radius: 6px; overflow: hidden; display: flex; background: var(--surface-2); }
  .balance-full .tag { text-align: center; font-size: 12px; color: var(--text-dim); margin-top: 8px; font-weight: 600; }

  .back-btn { margin-top: 22px; }

  /* ---------- alarm overlay ---------- */
  #alarmOverlay {
    position: fixed; inset: 0; z-index: 200; display: none; align-items: center; justify-content: center;
    background: rgba(15,17,21,.75); padding: 20px;
  }
  #alarmOverlay.show { display: flex; }
  .alarm-pop {
    background: var(--surface); border-radius: 20px; padding: 32px 26px; text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,.35); max-width: 320px;
  }
  .alarm-pop .ico { font-size: 42px; }
  .alarm-pop .big { font-size: 18px; font-weight: 800; margin-top: 10px; }
  .alarm-pop .tap { font-size: 13px; color: var(--text-dim); margin-top: 14px; }
  .alarm-pop button { margin-top: 18px; }

  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <h1>Zaalvoetbal</h1>
      <p>Teamgenerator</p>
    </div>
    <button class="icon-btn" id="alarmBtn" title="Wekker 21:30" aria-label="Wekker 21:30">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
    </button>
  </header>

  <!-- ===================== SELECTIE ===================== -->
  <main id="view-select">
    <div class="section-title">
      <h2>Selecteer spelers</h2>
      <span class="pill" id="counter">0 gekozen</span>
    </div>
    <div id="roster"></div>

    <div class="btnrow">
      <button class="btn ghost" id="clearBtn">Wis</button>
      <button class="btn primary" id="genBtn" disabled>Genereer teams</button>
    </div>
    <p class="hint">Kies 6 t/m 11 spelers</p>
    <p class="status-msg" id="statusMsg"></p>
  </main>

  <!-- ===================== RESULTAAT ===================== -->
  <main id="view-result" hidden>
    <div class="section-title">
      <h2>Alle mogelijke teamindelingen</h2>
      <span class="pill" id="comboCount"></span>
    </div>

    <div class="logistics">
      <div class="logistics-row">
        <div class="badge-card A" id="hesjesCard">
          <span class="ico">🦺</span>
          <div><div class="lbl">Hesjes</div><div class="val" id="hesjesVal">—</div></div>
        </div>
        <div class="badge-card B" id="aftrapCard">
          <span class="ico">⚽</span>
          <div><div class="lbl">Trapt af</div><div class="val" id="aftrapVal">—</div></div>
        </div>
      </div>
      <div class="card tikkie-card">
        <div class="tikkie-info">
          <div class="lbl">Tikkie · ieder betaalt</div>
          <div class="amt" id="tikkieAmt">€0,00</div>
        </div>
        <div class="tikkie-edit">
          <span>Totaal €</span>
          <input type="number" id="tikkieTotalInput" min="0" step="1" value="40">
        </div>
      </div>
    </div>

    <div id="comboList"></div>

    <button class="btn ghost back-btn" id="backBtn" style="width:100%">↩ Nieuwe selectie</button>
  </main>

</div>

<!-- ===================== WEKKER OVERLAY ===================== -->
<div id="alarmOverlay">
  <div class="alarm-pop">
    <div class="ico">🚨</div>
    <div class="big">Het is 21:30!</div>
    <div class="tap">Tijd om te stoppen (of nog één potje...)</div>
    <button class="btn primary" id="alarmDismiss">Sluiten</button>
  </div>
</div>

<script>
(function () {
  "use strict";

  /* ============================================================
     DATA — spelers + verborgen score.
     De score staat base64-encoded zodat de exacte waarde niet
     los in de broncode staat; alleen de relatieve sterren-rating
     wordt getoond. Dit blok is ongewijzigd overgenomen.
     ============================================================ */
  const encodedPlayers = [
    { name: "Arhan",   rank: "Ni4yNQ==" },
    { name: "David",   rank: "Ny42" },
    { name: "Henoch",  rank: "Ny44" },
    { name: "Jan",     rank: "OC40" },
    { name: "John",    rank: "Ni44" },
    { name: "Just",    rank: "Ny40" },
    { name: "Mathew",  rank: "Ni4x" },
    { name: "Mesach",  rank: "Ni42" },
    { name: "Stephan", rank: "OC45" },
    { name: "Tom B",   rank: "Ny45" },
    { name: "Tom P",   rank: "Ni44" },
  ];
  const decodeRank = (e) => parseFloat(atob(e));
  const players = encodedPlayers.map((p) => ({ name: p.name, rank: decodeRank(p.rank), selected: false }));

  function hashStr(s) { let h = 2166136261 >>> 0; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

  /* ============================================================
     BALANCERINGS-LOGICA — ongewijzigd overgenomen.
     ============================================================ */
  function isValidTeamSplit(a, b, n) {
    if (n === 6)  return a === 3 && b === 3;
    if (n === 7)  return (a === 4 && b === 3) || (a === 3 && b === 4);
    if (n === 8)  return a === 4 && b === 4;
    if (n === 9)  return (a === 5 && b === 4) || (a === 4 && b === 5);
    if (n === 10) return a === 5 && b === 5;
    if (n === 11) return (a === 5 && b === 6) || (a === 6 && b === 5);
    return false;
  }
  function calcWeightedAvg(team) {
    const n = team.length;
    if (n === 3 || n === 4) return team.reduce((s, p) => s + p.rank, 0) / n;
    if (n === 5) {
      let total = 0;
      for (let i = 0; i < n; i++) {
        const sub = team.filter((_, j) => j !== i);
        total += sub.reduce((s, p) => s + p.rank, 0) / 4;
      }
      return total / 5;
    }
    if (n === 6) {
      let total = 0, count = 0;
      const comb = (arr, k, start = 0, prev = []) => {
        if (prev.length === k) { total += prev.reduce((s, p) => s + p.rank, 0) / 4; count++; return; }
        for (let i = start; i < arr.length; i++) comb(arr, k, i + 1, prev.concat(arr[i]));
      };
      comb(team, 4);
      return total / count;
    }
    return 0;
  }
  function generateAllSplits(sel) {
    const n = sel.length, splits = [], seen = new Set(), total = 1 << n;
    for (let mask = 1; mask < total - 1; mask++) {
      const A2 = [], B2 = [];
      for (let i = 0; i < n; i++) (mask & (1 << i)) ? A2.push(sel[i]) : B2.push(sel[i]);
      if (!isValidTeamSplit(A2.length, B2.length, n)) continue;
      const na = A2.map((p) => p.name).sort().join(","), nb = B2.map((p) => p.name).sort().join(",");
      if (seen.has(na + "|" + nb) || seen.has(nb + "|" + na)) continue;
      seen.add(na + "|" + nb);
      const avgA = calcWeightedAvg(A2), avgB = calcWeightedAvg(B2);
      splits.push({ teamA: A2, teamB: B2, avgA, avgB, diff: Math.abs(avgA - avgB) });
    }
    splits.sort((a, b) => a.diff - b.diff);
    return splits;
  }
  function balanceTag(diff) {
    if (diff < 0.1)  return "Vrijwel perfect in balans";
    if (diff < 0.25) return "Goed gebalanceerd";
    if (diff < 0.5)  return "Redelijk eerlijk";
    return "Duidelijk scheve verdeling";
  }

  /* ============================================================
     UI helpers
     ============================================================ */
  const $ = (s, r) => (r || document).querySelector(s);
  const AVATAR_HUES = [4, 24, 44, 150, 172, 200, 222, 258, 280, 320, 340];
  function avatarStyle(name) {
    const h = AVATAR_HUES[hashStr(name) % AVATAR_HUES.length];
    return `background:hsl(${h} 62% 45%)`;
  }
  const initials = (n) => n.split(" ").map((w) => w[0]).join("").toUpperCase().slice(0, 2);

  /* ============================================================
     SELECTIE-SCHERM
     ============================================================ */
  const roster = $("#roster"), counter = $("#counter"), genBtn = $("#genBtn"), statusMsg = $("#statusMsg");
  const viewSelect = $("#view-select"), viewResult = $("#view-result");

  function buildRoster() {
    roster.innerHTML = players.map((p, i) => `
      <div class="prow" data-i="${i}">
        <div class="avatar" style="${avatarStyle(p.name)}">${initials(p.name)}</div>
        <div class="pbody">
          <div class="pname">${p.name}</div>
        </div>
        <div class="check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>
      </div>`).join("");
    roster.querySelectorAll(".prow").forEach((row) => {
      row.addEventListener("click", () => {
        const p = players[+row.dataset.i];
        p.selected = !p.selected;
        row.classList.toggle("sel", p.selected);
        updateCounter();
      });
    });
  }

  function updateCounter() {
    const n = players.filter((p) => p.selected).length;
    counter.textContent = `${n} gekozen`;
    counter.classList.toggle("ready", n >= 6 && n <= 11);
    genBtn.disabled = !(n >= 6 && n <= 11);
  }

  let statusT = null;
  function showStatus(msg) {
    statusMsg.textContent = msg;
    statusMsg.classList.add("show");
    clearTimeout(statusT);
    statusT = setTimeout(() => statusMsg.classList.remove("show"), 2200);
  }

  /* ============================================================
     RESULTAAT-SCHERM
     ============================================================ */
  let allSplits = [], baselineDiff = 0, tikkieTotal = 40, deelnemers = 0;

  function teamPlayersHTML(team) {
    return team.slice().sort((a, b) => a.name.localeCompare(b.name)).map((p) => `
      <div class="tplayer">
        <div class="avatar" style="${avatarStyle(p.name)}">${initials(p.name)}</div>
        <div class="pname">${p.name}</div>
      </div>`).join("");
  }

  function comboHTML(s, idx) {
    const totalAvg = s.avgA + s.avgB;
    const wA = ((s.avgA / totalAvg) * 100).toFixed(1);
    const wB = (100 - wA).toFixed(1);
    const fairLabel = idx === 0
      ? "Meest eerlijke indeling"
      : `+${(((s.diff - baselineDiff) / (baselineDiff || 1)) * 100).toFixed(0)}% minder eerlijk dan #1`;
    return `
      <details class="combo">
        <summary>
          <div class="combo-rank">${idx + 1}</div>
          <div class="combo-mid">
            <div class="combo-fair">${fairLabel}</div>
            <div class="combo-sub">Team A (${s.teamA.length}) vs Team B (${s.teamB.length}) · ${balanceTag(s.diff)}</div>
            <div class="mini-bar"><div class="a" style="width:${wA}%"></div><div class="b" style="width:${wB}%"></div></div>
          </div>
          <div class="combo-chevron"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg></div>
        </summary>
        <div class="combo-body">
          <div class="teamgrid">
            <div class="teamcol">
              <div class="teamcol-hd A"><span class="name">Team A</span></div>
              ${teamPlayersHTML(s.teamA)}
            </div>
            <div class="teamcol">
              <div class="teamcol-hd B"><span class="name">Team B</span></div>
              ${teamPlayersHTML(s.teamB)}
            </div>
          </div>
          <div class="balance-full">
            <div class="row"><span class="a">◀ Team A</span><span class="b">Team B ▶</span></div>
            <div class="bar"><div class="a" style="width:${wA}%;background:var(--teamA)"></div><div class="b" style="width:${wB}%;background:var(--teamB)"></div></div>
            <div class="tag">${balanceTag(s.diff)}</div>
          </div>
        </div>
      </details>`;
  }

  function renderCombos() {
    $("#comboCount").textContent = `${allSplits.length} combinatie${allSplits.length === 1 ? "" : "s"}`;
    $("#comboList").innerHTML = allSplits.map(comboHTML).join("");
  }

  function renderLogistics() {
    const bedrag = Math.ceil((tikkieTotal / deelnemers) * 100) / 100;
    $("#tikkieAmt").textContent = "€" + bedrag.toFixed(2).replace(".", ",");
  }

  function coinFlips() {
    const hesjes = Math.random() < 0.5 ? "A" : "B";
    const aftrap = Math.random() < 0.5 ? "A" : "B";
    $("#hesjesVal").textContent = "Team " + hesjes;
    $("#aftrapVal").textContent = "Team " + aftrap;
    $("#hesjesCard").className = "badge-card " + hesjes;
    $("#aftrapCard").className = "badge-card " + aftrap;
  }

  function onGenerate() {
    const sel = players.filter((p) => p.selected);
    if (sel.length < 6 || sel.length > 11) { showStatus("Kies tussen de 6 en 11 spelers."); return; }
    allSplits = generateAllSplits(sel);
    if (allSplits.length === 0) { showStatus("Geen geldige teamindeling gevonden voor dit aantal."); return; }
    baselineDiff = allSplits[0].diff;
    deelnemers = sel.length;
    coinFlips();
    renderLogistics();
    renderCombos();
    viewSelect.hidden = true;
    viewResult.hidden = false;
    window.scrollTo(0, 0);
  }

  $("#genBtn").addEventListener("click", onGenerate);
  $("#clearBtn").addEventListener("click", () => {
    players.forEach((p) => (p.selected = false));
    roster.querySelectorAll(".prow").forEach((r) => r.classList.remove("sel"));
    updateCounter();
  });
  $("#backBtn").addEventListener("click", () => {
    viewResult.hidden = true;
    viewSelect.hidden = false;
    window.scrollTo(0, 0);
  });
  $("#tikkieTotalInput").addEventListener("input", (e) => {
    const v = parseFloat(e.target.value);
    tikkieTotal = isNaN(v) || v < 0 ? 0 : v;
    renderLogistics();
  });

  /* ============================================================
     WEKKER 21:30 — met sirene overlay
     ============================================================ */
  let ctx = null;
  function ensureAudio() {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === "suspended") ctx.resume();
    return ctx;
  }
  let sirenStop = null;
  function startSiren() {
    const c = ensureAudio();
    const nodes = [];
    function beep(start) {
      const o = c.createOscillator(), g = c.createGain();
      o.type = "sawtooth";
      o.frequency.setValueAtTime(600, start);
      o.frequency.linearRampToValueAtTime(1200, start + 0.5);
      o.frequency.linearRampToValueAtTime(600, start + 1.0);
      g.gain.setValueAtTime(0.22, start);
      g.gain.setValueAtTime(0.22, start + 0.9);
      g.gain.linearRampToValueAtTime(0, start + 1.0);
      o.connect(g); g.connect(c.destination);
      o.start(start); o.stop(start + 1.0);
      nodes.push(o);
    }
    for (let i = 0; i < 30; i++) beep(c.currentTime + i * 1.1);
    sirenStop = () => nodes.forEach((o) => { try { o.stop(); } catch (e) {} });
  }
  function stopSiren() { if (sirenStop) { sirenStop(); sirenStop = null; } }

  const alarmBtn = $("#alarmBtn"), overlay = $("#alarmOverlay");
  let alarmActive = false, alarmFired = false;
  alarmBtn.addEventListener("click", () => {
    alarmActive = !alarmActive; alarmFired = false;
    alarmBtn.classList.toggle("active", alarmActive);
    ensureAudio();
    showStatus(alarmActive ? "Wekker aan · 21:30" : "Wekker uit");
  });
  function closeAlarm() {
    overlay.classList.remove("show");
    alarmBtn.classList.remove("active");
    alarmActive = false;
    stopSiren();
  }
  $("#alarmDismiss").addEventListener("click", closeAlarm);
  overlay.addEventListener("click", (e) => { if (e.target === overlay) closeAlarm(); });

  function hhmmAmsterdam() {
    const parts = new Intl.DateTimeFormat("nl-NL", { timeZone: "Europe/Amsterdam", hour: "2-digit", minute: "2-digit", hour12: false }).formatToParts(new Date());
    return parts.find((p) => p.type === "hour").value + ":" + parts.find((p) => p.type === "minute").value;
  }
  setInterval(() => {
    if (!alarmActive || alarmFired) return;
    if (hhmmAmsterdam() === "21:30") {
      alarmFired = true;
      overlay.classList.add("show");
      startSiren();
    }
  }, 10000);

  /* ============================================================
     INIT
     ============================================================ */
  buildRoster();
  updateCounter();
})();
</script>
</body>
</html>
